[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
# The one MemeX desktop version (0.x.y); every crate and the 「版本」 tab read it.
version = "0.1.48"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
gpui-kit = "=0.8.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
