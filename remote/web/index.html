<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lots MemeX 资料库</title>
  <link rel="stylesheet" href="/remote/v1/app.css">
</head>
<body>
  <main class="shell">
    <header class="app-header">
      <div class="topbar">
        <a class="nav-button" href="/settings" aria-label="设置">⚙ 设置</a>
        <a class="nav-button" href="/account">用户</a>
      </div>
      <div><p class="eyebrow">我的资料库</p><h1>Lots MemeX</h1></div>
      <div class="connection" aria-live="polite"><span id="connection-dot" class="dot"></span><span id="connection-state">正在安全启动…</span></div>
    </header>

    <section id="unsupported" class="notice" hidden>
      <h2 id="unsupported-heading">无法打开实时资料库</h2>
      <p id="unsupported-message">此浏览器无法安全保存所需的私钥。</p>
    </section>
    <section id="unpaired" class="notice" hidden>
      <strong>尚未连接 Mac。</strong> 资料库当前不可用；请在<a href="/settings">设置</a>中连接设备。
    </section>

    <section id="library" class="library-layout">
      <aside class="library-sidebar" aria-label="资料库导航">
        <p class="sidebar-heading">资料库</p>
        <div class="sidebar-row"><span>全部资料</span><span id="library-count" class="count">不可用</span></div>
      </aside>
      <div id="library-view" class="library-main">
        <div class="library-toolbar">
          <label class="search-field" for="library-search"><span class="sr-only">搜索资料</span><input id="library-search" type="search" autocomplete="off" placeholder="搜索标题或来源"></label>
          <select id="library-filter" aria-label="资料类型"><option value="all">全部类型</option><option value="webpage">网页</option><option value="other">其他</option></select>
          <button id="theme-button" class="icon-button" type="button" aria-label="切换日间或夜间显示">◐</button>
        </div>
        <div class="library-status"><p id="library-state" aria-live="polite">Mac Store 当前不可用，未显示权威条目数。</p><button id="library-refresh" class="text-button" type="button" disabled>刷新</button></div>
        <div id="library-list" class="library-list" aria-live="polite"></div>
        <button id="library-more" class="secondary" type="button" hidden>加载更多</button>
      </div>
    </section>
    <section id="error-card" class="notice error" hidden role="alert"><h2>暂时无法继续</h2><p id="error-message"></p></section>
    <article id="library-item" class="reader" hidden><button id="reader-back" class="text-button" type="button">← 返回资料库</button><p class="eyebrow">当前版本</p><h2 id="library-item-title"></h2><p id="library-item-meta" class="help"></p><p id="library-item-summary-state" class="help"></p><section class="reader-summary"><h3>摘要</h3><pre id="library-item-summary"></pre></section><pre id="library-item-body" class="reader-body"></pre></article>
  </main>
  <script>
  {
    const invalid = Boolean(window.location.search || window.location.hash);
    const fail = () => { window.history.replaceState(null, '', window.location.pathname || '/'); document.getElementById('connection-state').textContent = '请直接打开本页'; document.getElementById('unsupported').hidden = false; };
    if (invalid) fail(); else import('/remote/v1/app.mjs').then(({ startLibrary }) => startLibrary({ pageHref: window.location.href })).catch(() => { document.getElementById('connection-state').textContent = '暂时不可用'; document.getElementById('unsupported').hidden = false; });
  }
  </script>
</body>
</html>
